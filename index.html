<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hearth&amp;Crown" />
    <meta name="theme-color" content="#0e1426" />
    <meta name="format-detection" content="telephone=no" />
    <title>Hearth &amp; Crown</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud" hidden>
      <div class="hud-top">
        <div id="fps" class="hud-chip">-- fps</div>
        <div id="bench" class="hud-chip" hidden></div>
        <button id="menu-btn" class="hud-btn" aria-label="Menu">&#9776;</button>
      </div>
      <div class="hud-bottom-right"></div>
    </div>
    <div id="menu" class="panel-backdrop" hidden>
      <div class="panel">
        <button id="menu-resume">Resume</button>
        <button id="menu-new">New match</button>
      </div>
    </div>
    <div id="rotate" role="alert">
      <div class="rotate-phone"></div>
      <p>Rotate your phone to landscape</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
